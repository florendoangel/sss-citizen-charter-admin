<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSS Citizen's Charter</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--brand:#16336B;--brand2:#2A5DB0;--tint:#E9EFFB;--line:#E3E8F2;--ink:#1C2A44;--mut:#5B667A;--bg:#F3F5FA;--ok:#1E7A4B;--okbg:#E4F5EC;--warn:#9A6200;--warnbg:#FFF3D6;--bad:#B3261E;--badbg:#FDECEA;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}[hidden]{display:none!important}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.side{background:var(--brand);color:#fff;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}.brand img{width:46px;height:46px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.brand b{display:block;font-size:1.02rem;line-height:1.2}.brand small{display:block;color:#C9D8F4;font-size:.8rem;margin-top:2px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:12px;background:transparent;color:#DCE7FA;font-weight:600;cursor:pointer;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08)}.nav button.on{background:rgba(255,255,255,.17);color:#fff}
.nav svg{flex:none;opacity:.9}.nav .n{margin-left:auto;font-size:.75rem;background:rgba(255,255,255,.16);border-radius:99px;padding:1px 9px}
.sidefoot{margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding:14px 8px 0}.sidefoot p{margin:0 0 10px;color:#C9D8F4;font-size:.86rem}
.sidefoot button{width:100%;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-weight:700;cursor:pointer}
.sidefoot button:hover{background:rgba(255,255,255,.1)}
.main{min-width:0}.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;background:rgba(243,245,250,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:1.25rem}.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.pill.w{background:var(--warnbg);color:var(--warn)}.pill.b{background:var(--badbg);color:var(--bad)}.pill.g{background:var(--tint);color:var(--mut)}
.content{padding:24px 28px 60px;max-width:1180px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:700;border-radius:12px;padding:10px 18px;cursor:pointer;text-decoration:none}
.btn:hover{background:#0f2652}.btn.s{background:#fff;color:var(--brand);border-color:var(--line)}.btn.s:hover{background:var(--tint)}.btn.d{background:#fff;color:var(--bad);border-color:#F0C4C0}.btn.d:hover{background:var(--badbg)}.btn.sm{padding:6px 12px;font-size:.86rem;border-radius:10px}
.btn.on-top{background:var(--brand2);border-color:var(--brand2)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(22,51,107,.04)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:18px 20px}.stat b{display:block;font-size:1.9rem;line-height:1.1;color:var(--brand)}.stat span{color:var(--mut);font-size:.88rem;font-weight:600}
.panel{padding:22px 24px}.panel h2{margin:0 0 6px;font-size:1.08rem}.panel p{margin:0 0 14px;color:var(--mut)}
.note{background:var(--tint);border-radius:12px;padding:12px 16px;margin-bottom:16px;color:#23407A}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;min-width:0}.toolbar input{flex:1 1 240px}.toolbar select{flex:0 1 280px}
.tbl{overflow:hidden}.tr{display:grid;grid-template-columns:minmax(0,1fr) 96px 150px 150px;gap:12px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.tr.h{border-top:0;background:#FAFBFE;color:var(--mut);font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px}
.tr .t b{display:block;font-weight:700}.tr .t small{color:var(--mut)}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--okbg);color:var(--ok)}.tag.i{background:#EDE7FB;color:#5B3FA8}.tag.n{background:var(--tint);color:var(--mut)}.tag.y{background:var(--tint);color:var(--brand2)}
.acts{display:flex;gap:8px;justify-content:flex-end}.more{text-align:center;padding:16px}
.drow{display:flex;align-items:center;gap:14px;padding:16px 20px;border-left:4px solid var(--brand);border-radius:14px;margin-bottom:12px;cursor:pointer}.drow:hover{background:#FAFBFE}.drow b{flex:1;min-width:0}.cnt{background:var(--tint);color:var(--brand);font-weight:800;font-size:.82rem;border-radius:99px;padding:3px 12px}
.fl{display:block;font-weight:700;margin:18px 0 6px}.fl:first-child{margin-top:0}.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff}.in:focus,.toolbar input:focus,.toolbar select:focus{outline:2px solid var(--brand2);outline-offset:1px}textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hint{color:var(--mut);font-size:.88rem;margin:6px 0 0}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.pdfbox{border:1px dashed #B9C7E6;background:#F7F9FE;border-radius:14px;padding:16px}.pdfrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.pdfrow .nm{font-weight:700;word-break:break-all}.pdfrow .sz{color:var(--mut);font-size:.88rem}
.ghead{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#FAFBFE;border-top:1px solid var(--line)}.ghead b{flex:1;min-width:0}.oitem{display:flex;gap:14px;align-items:flex-start;padding:13px 20px;border-top:1px solid var(--line)}.oitem .t{flex:1;min-width:0}.oitem small{color:var(--mut);display:block}
.fbcard{padding:18px 20px;margin-bottom:14px}.fbcard .top2{display:flex;gap:10px;align-items:center;margin-bottom:10px}.fbcard .top2 input{flex:1;font-weight:700}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#12213F;color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:30;max-width:90vw}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#16336B 0,#2A5DB0 300px,#E9EFFB 300px)}
.gcard{width:min(440px,100%);background:#fff;border-radius:22px;box-shadow:0 24px 70px rgba(22,51,107,.32);overflow:hidden}
.gtop{background:linear-gradient(150deg,#16336B,#2A5DB0);color:#fff;text-align:center;padding:34px 24px 38px}.gtop img{width:68px;height:68px;border-radius:15px;box-shadow:0 10px 26px rgba(0,0,0,.28)}
.gtop small{display:block;margin-top:16px;letter-spacing:.16em;text-transform:uppercase;font-size:.74rem;color:#DCE7FA;font-weight:700}.gtop h2{margin:6px 0 4px;font-size:1.5rem}.gtop p{margin:0;color:#DCE7FA;font-size:.92rem}
.gform{padding:28px 28px 30px}.pw{position:relative}.pw .in{padding-right:48px}.pw button{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:transparent;cursor:pointer;color:var(--mut)}
.perr{color:var(--bad);min-height:1.4em;margin:8px 0;font-weight:600}.gform .btn{width:100%;padding:13px}.lockrow{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:14px;color:var(--mut);font-size:.86rem}
.empty{padding:34px;text-align:center;color:var(--mut)}
.hero2{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:30px 32px;margin-bottom:18px;border-radius:22px;color:#fff;background:radial-gradient(circle at 92% 8%,rgba(255,255,255,.18) 0,transparent 38%),radial-gradient(circle at 70% 120%,rgba(255,206,86,.28) 0,transparent 42%),linear-gradient(135deg,#16336B 0,#2A5DB0 100%);box-shadow:0 14px 34px rgba(22,51,107,.26);position:relative;overflow:hidden}
.hero2 .eyebrow{display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#FFD66B;margin-bottom:8px}.hero2 h2{margin:0 0 6px;font-size:1.9rem;line-height:1.15}.hero2 p{margin:0 0 18px;color:#DCE7FA}
.hero2 .btn.lt{background:#fff;color:var(--brand);border-color:#fff}.hero2 .btn.lt:hover{background:#EAF0FC}.hero2 .btn.gl{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.5);color:#fff}.hero2 .btn.gl:hover{background:rgba(255,255,255,.25)}
.chip{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:14px 18px;backdrop-filter:blur(4px);min-width:250px}
.chip small,.lastbig small{display:block;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8}.chip b,.lastbig b{display:block;font-size:1.02rem;word-break:break-all}.chip em,.lastbig em{font-style:normal;font-size:.86rem;opacity:.85}
.av{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#FFD66B;color:#16336B;font-weight:800;font-size:1.1rem;flex:none}.av.sm{width:34px;height:34px;font-size:.95rem;background:var(--tint);color:var(--brand)}
.lastbig{display:flex;align-items:center;gap:14px;background:var(--tint);color:var(--brand);border-radius:14px;padding:14px 18px;margin:8px 0 6px}
.tl{margin-top:8px}.tli{display:flex;gap:14px;align-items:center;padding:12px 2px;border-top:1px solid var(--line)}.tli .t{min-width:0}.tli small{display:block;color:var(--mut)}
.stat{border-top:4px solid var(--brand2)}.stat.c1{border-top-color:#2EA66B}.stat.c2{border-top-color:#E0A21B}.stat.c3{border-top-color:#7A5BD6}.stat.c4{border-top-color:#E0574F}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--brand2);font-weight:700;padding:6px 2px;margin:0 0 12px;cursor:pointer;font-size:.95rem}.back:hover{text-decoration:underline}
.welcome{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px 24px;margin-bottom:16px;background:linear-gradient(120deg,#fff 0,#F1F5FD 100%)}.welcome h2{margin:0 0 4px;font-size:1.2rem}.welcome p{margin:0;color:var(--mut);max-width:540px}.qa{display:flex;gap:10px;flex-wrap:wrap}
input[type=file]{width:100%;font-size:.92rem;color:var(--mut)}input[type=file]::file-selector-button{border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:700;border-radius:10px;padding:8px 16px;margin-right:12px;cursor:pointer}input[type=file]::file-selector-button:hover{background:#0f2652}
#toast{display:flex;align-items:center;gap:10px;font-weight:600}#toast .tk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#2EA66B;color:#fff;font-size:.8rem;flex:none}
.btn:focus-visible,.nav button:focus-visible,.back:focus-visible,.tab:focus-visible{outline:3px solid #8FB2F0;outline-offset:2px}
.srow:hover{background:#FAFBFE}.btn.sm{min-height:36px}

@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:column;padding:12px}.brand{padding-bottom:10px}.nav{flex-direction:row;overflow-x:auto;gap:6px}.nav button{width:auto;white-space:nowrap;padding:10px 14px}.nav .n{display:none}.sidefoot{display:flex;gap:10px;align-items:center;margin-top:10px;padding:10px 4px 0}.sidefoot p{margin:0;flex:1}.sidefoot button{width:auto;padding:8px 16px}.top{padding:12px 16px;position:static}.content{padding:16px 14px 50px}.tr{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}.tr.h{display:none}.tr .c4{display:none}.row2{grid-template-columns:1fr}}

.btn:disabled{opacity:.55;cursor:wait}.cfgbox{background:#FFF3D6;color:#7A4D00;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:.92rem}.ok{color:var(--ok);font-weight:600}
.tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 18px;font-weight:700;color:var(--mut);cursor:pointer;display:inline-flex;gap:8px;align-items:center}.tab .n{background:#EEF1F7;border-radius:99px;padding:1px 9px;font-size:.8rem}.tab.on{background:var(--brand2);border-color:var(--brand2);color:#fff}.tab.on .n{background:rgba(255,255,255,.25);color:#fff}
details.dep{background:#fff;border:1px solid var(--line);border-left:5px solid var(--brand2);border-radius:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(22,51,107,.04);overflow:hidden}
details.dep>summary{cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 20px;font-weight:700;font-size:1.02rem;list-style:none}details.dep>summary::-webkit-details-marker{display:none}details.dep>summary:hover{background:#FAFBFE}
details.dep>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s;flex:none}details.dep[open]>summary::before{transform:rotate(45deg)}
details.dep>summary .c{margin-left:auto;background:var(--tint);color:var(--brand);border-radius:99px;padding:2px 12px;font-size:.85rem;font-weight:800}
.srow{display:flex;gap:14px;align-items:center;padding:13px 20px;border-top:1px solid var(--line)}.srow .t{flex:1;min-width:0}.srow .t b{display:block;font-weight:600}.srow .t small{color:var(--mut)}.srow .acts{flex:none}
@media(max-width:700px){.srow{flex-wrap:wrap}}
</style></head><body>

  const byName = new Map(files.map(f => [f.name.toLowerCase(), f]));
  const have = need.filter(p => byName.has(p.split('/').pop().toLowerCase()));
  if (need.length && !files.length && !confirm('No pdfs folder was chosen, so the ' + need.length + ' PDFs will not be uploaded and services will be imported without them.\n\nContinue?')) return;
  if (!confirm('Import ' + o.items.length + ' services, ' + have.length + ' of ' + need.length + ' PDFs, offices and feedback?\n\nThis REPLACES the published website and goes live now.')) return;

    await Promise.all([worker(), worker(), worker(), worker()]);
    let missing = 0; o.det.forEach(d => { if (d.pdf && !/^https?:\/\//i.test(d.pdf)) { if (urls.has(d.pdf)) d.pdf = urls.get(d.pdf); else { missing++; delete d.pdf; delete d.pdfName } } });
    DATA = {depts: o.depts, items: o.items, det: o.det, offices: o.offices, fb: o.fb}; DATA.offices = regroup(DATA.offices);

  else if (a === 'qoff') { view = 'off'; OW = {g: 0, i: -1, n: '', a: '', ph: '', em: ''}; $$('.nav button').forEach(x => x.classList.toggle('on', x.dataset.go === 'off')); render() }
  else if (a === 'svccancel') { W = null; render() } else if (a === 'svcsave') saveSvc()
  else if (a === 'svcdel') two(b, 'Click again to delete', () => { logChange('Deleted service', DATA.items[i][1]); DATA.items.splice(i, 1); DATA.det.splice(i, 1); touch(); toast('Service deleted'); $('#slist').innerHTML = svcList(); counts() })
  else if (a === 'stab') { stp = b.dataset.v; render() }
  else if (a === 'expand') { const ds = $$('#page details.dep'), all = ds.length && ds.every(d => d.open); ds.forEach(d => { d.open = !all }); b.textContent = all ? 'Expand all' : 'Collapse all' }
  else if (a === 'rmpdf') { W.pdf = ''; W.pdfName = ''; $('#pdfinfo').innerHTML = pdfInfo(W); $('#f-pdf').value = '' }
  else if (a === 'dopen') { sd = String(i); stp = DATA.items.some(x => x[0] === i && x[5] !== 'internal') ? 'external' : 'internal'; sq = ''; lim = 60; go('svc') }
  else if (a === 'dadd') { const n = (prompt('New department name:') || '').trim(); if (n) { if (DATA.depts.some(d => d.toLowerCase() === n.toLowerCase())) return toast('That department already exists'); DATA.depts.push(n); logChange('Added department', n); touch(); render() } }
  else if (a === 'dren') { const old = DATA.depts[i], n = (prompt('Rename department:', old) || '').trim(); if (n && n !== old) { DATA.depts[i] = n; DATA.items.forEach((x, k) => { if (x[0] === i && DATA.det[k].m && DATA.det[k].m['Office or Division'] === old) DATA.det[k].m['Office or Division'] = n }); logChange('Renamed department', old + ' → ' + n); touch(); render() } }
  else if (a === 'ddel') two(b, 'Click again to delete', () => { logChange('Deleted department', DATA.depts[i]); DATA.depts.splice(i, 1); DATA.items.forEach(x => { if (x[0] > i) x[0]-- }); sd = 'all'; touch(); toast('Department deleted'); render() })
  else if (a === 'offnew') { OW = {g: og !== 'all' ? +og : 0, i: -1, n: '', a: '', ph: '', em: ''}; render() }
  else if (a === 'offedit') { OW = Object.assign({g: gi, i}, DATA.offices[gi].items[i]); render() } else if (a === 'offcancel') { OW = null; render() } else if (a === 'offsave') saveOff()
  else if (a === 'offdel') two(b, 'Click again to delete', () => { logChange('Deleted office', DATA.offices[gi].items[i].n); DATA.offices[gi].items.splice(i, 1); touch(); toast('Office deleted'); $('#olist').innerHTML = offList(); counts() })
  else if (a === 'gadd') { const n = (prompt('Name of the new region / group:') || '').trim(); if (!n) return; const abroad = confirm('Is this group for offices ABROAD?\n\nOK = abroad   |   Cancel = Philippines'); DATA.offices.push({cat: abroad ? 'abroad' : 'local', t: n, items: []}); touch(); render() }
  else if (a === 'gren') { const old = DATA.offices[gi].t, n = (prompt('Rename region / group:', old) || '').trim(); if (n && n !== old) { DATA.offices[gi].t = n; touch(); render() } }
  else if (a === 'gdel') two(b, 'Click again to delete', () => { DATA.offices.splice(gi, 1); og = 'all'; touch(); render() })
  else if (a === 'fbadd') { DATA.fb.rows.push([{t: 'New card', x: ''}]); logChange('Added Feedback card', ''); touch(); render() }
  else if (a === 'fbdel') two(b, 'Click again to delete', () => { const r = +b.dataset.r, c = +b.dataset.c; DATA.fb.rows[r].splice(c, 1); DATA.fb.rows = DATA.fb.rows.filter(x => x.length); logChange('Deleted Feedback card', ''); touch(); render() })
  else if (a === 'reset') two(b, 'Click again to discard', () => kvDel('work').then(() => location.reload()))
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'sq') { sq = t.value; lim = 60; $('#slist').innerHTML = svcList() } else if (t.id === 'oq') { oq = t.value; $('#olist').innerHTML = offList() }
  else if (t.dataset && t.dataset.fb) { const f = DATA.fb, k = t.dataset.fb; if (k === 'title' || k === 'lead') f[k] = t.value; else f.rows[+t.dataset.r][+t.dataset.c][k] = t.value; logChange('Edited Feedback page', '', true); touch() }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sd') { sd = t.value; lim = 60; $('#slist').innerHTML = svcList() } else if (t.id === 'st') { stp = t.value; lim = 60; $('#slist').innerHTML = svcList() } else if (t.id === 'og') { og = t.value; $('#olist').innerHTML = offList() }
  else if (t.id === 'f-dept') { $('#f-nd').hidden = t.value !== '__new'; if (t.value === '__new') $('#f-nd').focus() }
  else if (t.id === 'f-pdf') readPdf(t.files[0])
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d || !d.matches || !d.matches('details.dep') || !d.dataset.k) return;
  if (d.dataset.k.startsWith('s:') ? (sq.trim() || sd !== 'all') : (oq.trim() || og !== 'all')) return;
  if (d.open) openG.add(d.dataset.k); else openG.delete(d.dataset.k)
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'pw' || e.target.id === 'em')) tryLogin() });
window.addEventListener('beforeunload', e => { if (AUTO && (dirty || syncing)) { e.preventDefault(); e.returnValue = '' } });
boot()
})();
</script>
</body></html>
